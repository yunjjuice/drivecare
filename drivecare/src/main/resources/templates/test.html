<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test 페이지</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        h1 { color: #2c3e50; }
        p { font-size: 18px; }
    </style>
</head>
<body>
<h1>안녕하세요, 타임리프 테스트 페이지입니다!</h1>
<p>오늘 날짜는 <span th:text="${today}">2025-09-02</span> 입니다.</p>

<h2>사용자 리스트</h2>
<ul>
    <li th:each="user : ${users}" th:text="${user}"></li>
</ul>

<h2>사용자 추가</h2>
<form th:action="@{/page/hello}" th:object="${pageDto}" method="post">
    <input type="text" th:field="*{name}" placeholder="이름 입력"/>
    <button type="submit">추가</button>
</form>
</body>
</html>
