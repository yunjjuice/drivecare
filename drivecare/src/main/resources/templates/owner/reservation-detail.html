<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/ownerLayout}">
<div layout:fragment="ownerContent">
    <main class="main">
        <div class="reservation-card">
            <h2>예약 상세 정보</h2>

            <div class="info-grid">

                <!-- 1. 예약 기본 정보 -->
                <div class="info-group">
                    <h3>예약 정보</h3>
                    <p><strong>예약 번호:</strong>
                        <span th:text="'#' + ${reservationDetail.id}"></span>
                    </p>
                    <p><strong>예약 일시:</strong>
                        <td th:text="${#temporals.format(reservationDetail.reserveDt, 'yyyy-MM-dd a hh:mm')}"></td>

                    </p>
                    <p><strong>정비소:</strong>
                        <span th:text="${reservationDetail.carCenterNm}"></span>
                    </p>
                    <p><strong>예약 상태:</strong>
                        <span th:switch="${reservationDetail.approveStatus}">
                <span th:case="'Y'" class="status-badge status-confirmed">확정</span>
                <span th:case="'P'" class="status-badge status-pending">대기</span>
                <span th:case="'N'" class="status-badge status-rejected">거절</span>
            </span>
                    </p>
                </div>


                <!-- 2. 차량 정보 -->
                <div class="info-group">
                    <h3>차량 정보</h3>
                    <p><strong>차종:</strong>
                        <span th:text="${reservationDetail.carNm}"></span>
                    </p>
                    <p><strong>차량 번호:</strong>
                        <span th:text="${reservationDetail.carNumber}"></span>
                    </p>
                </div>

                <!-- 3. 증상 상세 (전체 너비 사용) -->
                <div class="info-group full-width">
                    <h3>증상</h3>
                    <ul>
                        <li th:text="${reservationDetail.desc}"></li>
                    </ul>
                </div>

                <!-- 4. 정비 상세 (전체 너비 사용) -->
                <div class="info-group full-width">
                    <h3>정비 상세</h3>
                    <ul>
                        <li th:text="${reservationDetail.repairDesc}"></li>
                    </ul>
                </div>
                <!-- 5. 정비소 정보 -->
                <div class="info-group">
                    <h3>정비소 정보</h3>
                    <p><strong>전화:</strong>
                        <span th:text="${reservationDetail.carCenterNum}">02-1234-5678</span>
                    </p>
                    <p><strong>주소:</strong>
                        <span th:text="${reservationDetail.carCenterAddress}">서울특별시 강남구 테헤란로 123</span>
                    </p>
                </div>
            </div>
        </div>
    </main>
</div>
