<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dealerLayout}">
<div layout:fragment="dealerContent">
  <!-- Main -->
  <main class="main">
    <header class="top">
      <span class="chip">정비소 상태: <b>영업 준비</b></span>
      <div class="spacer"></div>
      <div class="user">
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <b>홍길동 정비사</b><br/>
          <small class="muted">master@garage.co.kr</small>
        </div>
      </div>
    </header>

    <!-- Profile -->
    <section class="section active" id="profile">
      <div class="grid cols-2">
        <div class="card">
          <h3>정비소 기본 정보</h3>
          <div class="two">
            <div>
              <label>상호명</label>
              <input type="text" id="shopName" placeholder="예: 길동모터스" required />
            </div>
            <div>
              <label>사업자등록번호</label>
              <input type="text" id="bizNo" placeholder="000-00-00000" />
            </div>
          </div>
          <div class="two" style="margin-top:10px">
            <div>
              <label>대표 연락처</label>
              <input type="tel" id="phone" placeholder="010-0000-0000"/>
            </div>
            <div>
              <label>대표 이메일</label>
              <input type="email" id="email" placeholder="info@garage.co.kr"/>
            </div>
          </div>
          <div style="margin-top:10px">
            <label>주소</label>
            <input type="text" id="address" placeholder="도로명 주소" />
            <p class="help">지번/도로명 모두 입력 가능. 지도 연동은 백엔드 연결 후 사용.</p>
          </div>
          <div style="margin-top:10px">
            <label>소개</label>
            <textarea id="about" placeholder="정비소 소개를 입력하세요."></textarea>
          </div>
          <div style="margin-top:10px">
            <label>편의시설</label>
            <div class="pillset">
              <span class="pill badge">와이파이</span>
              <span class="pill badge">대기실</span>
              <span class="pill badge">야간 입고</span>
              <span class="pill badge">대차 서비스</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn ghost" data-demo="fill">데모 채우기</button>
            <button class="btn primary" data-save="profile">저장</button>
          </div>
        </div>

        <div class="card">
          <h3>영업 시간</h3>
          <table class="hours">
            <thead><tr><th>요일</th><th>오픈</th><th>마감</th><th>휴무</th></tr></thead>
            <tbody id="hoursBody">
            <!-- JS가 생성 -->
            </tbody>
          </table>
          <div class="actions">
            <button class="btn" id="copyWeek">평일 복사</button>
            <button class="btn primary" data-save="hours">저장</button>
          </div>
          <p class="help">특별휴무(명절 등)는 예약 화면에서 차단 가능.</p>
        </div>

        <div class="card" style="grid-column: 1/-1">
          <h3>사진 / 문서</h3>
          <div class="uploader" id="gallery">
            <label class="upload-tile" style="cursor:pointer">
              <input type="file" accept="image/*" multiple style="display:none" id="fileInput" />
              + 업로드
            </label>
            <!-- 미리보기 타일이 여기에 추가됨 -->
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
</html>
