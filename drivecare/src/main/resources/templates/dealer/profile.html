<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/dealerLayout}">

<th:block layout:fragment="scripts">
  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <script>
    window.getKakaoAddressSearch = function () {
      new daum.Postcode({
        oncomplete: function (data) {
          // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분입니다.
          // 예제를 참고하여 다양한 활용법을 확인해 보세요.
          console.log('data', data);

          Promise.resolve(data).then(o => {
            const {address} = data;
            document.getElementById('address').value = address;

            return new Promise((resolve, reject) => {
              const geocoder = new kakao.maps.services.Geocoder();

              geocoder.addressSearch(address, (result, status) => {
                if (status === kakao.maps.services.Status.OK) {
                  const {x, y} = result[0];

                  resolve({lat: y, lon: x})
                } else {
                  reject();
                }
              });
            })
          }).then(result => {
            // 위, 경도 결과 값
            console.log('result', result);
            document.getElementById('latitude').value = result.lat;
            document.getElementById('longitude').value = result.lon;
          });
        }
      }).open();
    }

    function saveProfile() {
      const name = document.getElementById('name').value;
      const telNo = document.getElementById('telNo').value;
      const email = document.getElementById('email').value;
      const address = document.getElementById('address').value;
      const latitude = document.getElementById('latitude').value;
      const longitude = document.getElementById('longitude').value;
      const desc = document.getElementById('desc').value;

      const profileData = {
        name, telNo, email, address, latitude, longitude, desc
      };

      console.log('profileData', profileData);

      fetch('/api/dealer/profile', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(profileData)
      })
      .then(response => {
        if (response.ok) {
          alert('정비소 정보가 저장되었습니다.');
        } else {
          alert('저장 중 오류가 발생했습니다.');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        alert('저장 중 오류가 발생했습니다.');
      });
    }

    function formatPhoneNumber(value) {
      value = value.replace(/\D/g, ''); // 숫자만 남김
      let result = '';

      if (value.startsWith('02')) {
        // 서울번호: 02-xxxx-xxxx
        if (value.length < 3) {
          result = value;
        } else if (value.length < 6) {
          result = value.slice(0, 2) + '-' + value.slice(2);
        } else if (value.length < 10) {
          result = value.slice(0, 2) + '-' + value.slice(2, value.length - 4) + '-' + value.slice(-4);
        } else {
          result = value.slice(0, 2) + '-' + value.slice(2, 6) + '-' + value.slice(6, 10);
        }
      } else {
        // 휴대폰: 010-xxxx-xxxx 등
        if (value.length < 4) {
          result = value;
        } else if (value.length < 8) {
          result = value.slice(0, 3) + '-' + value.slice(3);
        } else {
          result = value.slice(0, 3) + '-' + value.slice(3, value.length - 4) + '-' + value.slice(-4);
        }
      }
      return result;
    }

    document.addEventListener('DOMContentLoaded', function () {
      const telInput = document.getElementById('telNo');
      telInput.addEventListener('input', function (e) {
        // 숫자만 남기고, 포맷 적용
        let onlyNums = e.target.value.replace(/\D/g, '');
        e.target.value = formatPhoneNumber(onlyNums);
      });

      // 키보드 입력 제한 (숫자, 백스페이스 등만 허용)
      telInput.addEventListener('keydown', function (e) {
        // 허용: 숫자키, 백스페이스, 딜리트, 방향키, 탭
        if (
                !(
                        (e.key >= '0' && e.key <= '9') ||
                        ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)
                )
        ) {
          e.preventDefault();
        }
      });
    });
  </script>
</th:block>

<div layout:fragment="dealerContent">
  <!-- Main -->
  <main class="main">
    <header class="top">
      <span class="chip">정비소 상태: <b>영업 준비</b></span>
      <div class="spacer"></div>
      <div class="user">
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <b th:text="${loginUser.name}"></b><br/>
          <small class="muted" th:text="${loginUser.email}"></small>
        </div>
      </div>
    </header>

    <!-- Profile -->
    <section class="section active" id="profile">
      <div class="grid cols-2">
        <div class="card">
          <h3>정비소 기본 정보</h3>
          <div>
            <div>
              <label>상호명</label>
              <input type="text" id="name" placeholder="예: 길동모터스" required th:value="${carCenter.name}" />
            </div>
          </div>
          <div class="two" style="margin-top:10px">
            <div>
              <label>대표 연락처</label>
              <input type="tel" id="telNo" placeholder="010-0000-0000" th:value="${carCenter.telNo}" />
            </div>
            <div>
              <label>대표 이메일</label>
              <input type="email" id="email" placeholder="info@garage.co.kr" th:value="${carCenter.email}" />
            </div>
          </div>
          <div style="margin-top:10px">
            <label>주소</label>
            <input type="text" id="address" placeholder="주소" readonly onclick="getKakaoAddressSearch()" style="cursor:pointer; background-color:#f9f9f9;" th:value="${carCenter.address}" />
            <input type="text" id="latitude" hidden th:value="${carCenter.latitude}">
            <input type="text" id="longitude" hidden th:value="${carCenter.longitude}">
          </div>
          <div style="margin-top:10px">
            <label>소개</label>
            <textarea id="desc" placeholder="정비소 소개를 입력하세요." th:text="${carCenter.desc}"></textarea>
          </div>
          <div style="margin-top:10px">
            <label>편의시설</label>
            <div class="pillset">
              <span class="pill badge">와이파이</span>
              <span class="pill badge">대기실</span>
              <span class="pill badge">야간 입고</span>
              <span class="pill badge">대차 서비스</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" data-save="profile" onclick="saveProfile()">저장</button>
          </div>
        </div>

        <div class="card">
          <h3>영업 시간</h3>
          <table class="hours">
            <thead><tr><th>요일</th><th>오픈</th><th>마감</th><th>휴무</th></tr></thead>
            <tbody id="hoursBody">
            <!-- JS가 생성 -->
            </tbody>
          </table>
          <div class="actions">
            <button class="btn" id="copyWeek">평일 복사</button>
            <button class="btn primary" data-save="hours">저장</button>
          </div>
          <p class="help">특별휴무(명절 등)는 예약 화면에서 차단 가능.</p>
        </div>

<!--        <div class="card" style="grid-column: 1/-1">-->
<!--          <h3>사진 / 문서</h3>-->
<!--          <div class="uploader" id="gallery">-->
<!--            <label class="upload-tile" style="cursor:pointer">-->
<!--              <input type="file" accept="image/*" multiple style="display:none" id="fileInput" />-->
<!--              + 업로드-->
<!--            </label>-->
<!--            &lt;!&ndash; 미리보기 타일이 여기에 추가됨 &ndash;&gt;-->
<!--          </div>-->
<!--        </div>-->
      </div>
    </section>
  </main>
</div>
</html>
