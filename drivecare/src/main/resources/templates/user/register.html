<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}">
<th:block layout:fragment="scripts">
  <script th:src="@{/js/user/register.js}"></script>
</th:block>
<div layout:fragment="content">
  <form th:action="@{/register}" th:object="${registerRequestDto}" method="post">
    <div id="wrap">
      <!-- Contents -->
      <div id="contents">
        <!-- Input -->
        <div class="input_wrap">
          <div class="top_box">
            <span class="title">회원가입</span>
          </div>
          <table>
            <tr>
              <th><label>User ID</label></th>
              <td>
                <span class="tooltip_wrap">
                  <input type="text" th:field="*{userId}" placeholder="User ID" />
                  <div class="tooltip" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}">필수 입력</div>
                  <span id="idCheckResult"></span>
                </span>
              </td>
              <td class="btn">
                <button type="button" id="btnCheckId" th:data-check-url="@{/check-id}">Check</button>
              </td>
            </tr>

            <tr>
              <th><label>Password</label></th>
              <td>
                <span class="tooltip_wrap">
                  <input type="text" th:field="*{password}" placeholder="Password" />
                  <div class="tooltip" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">필수 입력</div>
                </span>
            </tr>

            <tr>
              <th><label>Password Confirm</label></th>
              <td>
              <span class="tooltip_wrap">
                <input type="text" th:field="*{confirmPassword}" placeholder="Password" />
                <div class="tooltip" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">필수 입력</div>
              </span>
            </tr>

            <tr>
              <th><label>이름</label></th>
              <td><input type="text" th:field="*{name}" placeholder="사용자 이름" /></td>
              <td></td>
            </tr>

            <tr>
              <th><label>Email</label></th>
              <td>
                <span class="tooltip_wrap">
                  <input type="email" th:field="*{email}" placeholder="Email" />
                  <div class="tooltip" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">필수 입력</div>
                </span>
              </td>
              <td class="btn">
                <button type="button" id="btnCheckEmail">Check</button>
              </td>
            </tr>

            <tr>
              <th><label >권한</label></th>
              <td>
                <select th:field="*{auth}">
                  <option value="admin">관리자</option>
                  <option value="dealer">정비사</option>
                  <option value="general">사용자</option>
                </select>
              </td>
              <td></td>
            </tr>
          </table>
        </div>
        <!-- //Input -->

        <!-- Bottom Buttons -->
        <div class="btn_bottom">
          <button type="button" class="bt_gray" th:onclick="|location.href='@{/login}'|">취소</button>
          <button type="submit">회원가입</button>
        </div>

      </div>
      <!-- //Contents -->
    </div>
  </form>
</div>
