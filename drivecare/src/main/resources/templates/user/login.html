<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인 · Drivecare+</title>
  <link rel="stylesheet" th:href="@{/css/dealer/dealer-style.css}">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <style>
    /* 로그인 레이아웃 */
    body {
      margin: 0;
      background: linear-gradient(180deg, #e9ecf1 0%, #dfe3eb 60%, #cfd5e0 100%);
      font: 14px/1.5 system-ui, "Apple SD Gothic Neo", "Noto Sans KR", Segoe UI, Roboto, Arial;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 420px;
      padding: 40px 36px;
      text-align: center;
      animation: fadeIn .4s ease;
    }

    .login-box .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: radial-gradient(120% 120% at 20% 20%, #93c5fd, #60a5fa 60%, #2563eb 100%);
      box-shadow: var(--shadow);
      margin: 0 auto 14px;
    }

    .login-box h1 {
      font-size: 20px;
      margin: 10px 0 25px 0;
      color: var(--text);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-form input {
      width: 100%;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px 10px 38px;
      color: var(--text);
      font-size: 14px;
      background-repeat: no-repeat;
      background-position: 10px center;
      transition: border-color .15s, box-shadow .15s;
    }

    .login-form input[type="text"] {
      background-image: url('/images/ico_id.png');
    }

    .login-form input[type="password"] {
      background-image: url('/images/ico_pw.png');
    }

    .login-form input:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
      outline: none;
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s;
    }

    .btn-login:hover {
      filter: brightness(0.96);
    }

    .link-area {
      margin-top: 16px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    .link-area a {
      color: var(--muted);
      text-decoration: none;
    }

    .link-area a:hover {
      text-decoration: underline;
    }

    .login-footer {
      margin-top: 22px;
      font-size: 12px;
      color: var(--muted);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
<div class="login-container">
  <div class="login-box">
    <div class="brand-logo"></div>
    <h1>GIT Drivecare+</h1>

    <form th:action="@{/login}" th:object="${loginRequestDto}" method="post" class="login-form">
      <input type="text" th:field="*{userId}" placeholder="아이디" required>
      <input type="password" th:field="*{password}" placeholder="비밀번호" autocomplete="off" required>
      <button type="submit" class="btn-login">로그인</button>
    </form>

    <div class="link-area">
      <a th:href="@{/register}">회원가입</a>
      <a th:href="@{/forgot}">아이디/비밀번호 찾기</a>
    </div>

    <div class="login-footer">
      GIT Drivecare+ © 2025
    </div>
  </div>
</div>

<script th:inline="javascript">
  const errorMessage = /*[[${errorMessage}]]*/ null;
  if (errorMessage) {
    Swal.fire({
      icon: 'error',
      title: '로그인 실패',
      text: errorMessage,
      confirmButtonText: '확인',
      confirmButtonColor: '#2563eb'
    });
  }
</script>
</body>
</html>
