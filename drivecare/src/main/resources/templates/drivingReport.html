<!-- src/main/resources/templates/drivingReport.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body style="margin:0; padding:0; background:#f6f7fa; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f6f7fa;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="650" style="max-width:650px; width:100%; background:#ffffff; border-radius:16px; border:1px solid #e6e9ef;">
        <tr>
          <td style="padding:32px 28px 8px 28px; font-family:Segoe UI, Arial, Helvetica, sans-serif; color:#222222;">
            <div style="font-size:28px; font-weight:800; line-height:1.3; margin:0 0 10px 0;"
                 th:text="${period} + ' 운전자 리포트'">리포트</div>
            <div style="font-size:16px; color:#176ecc; line-height:1.6; margin:0 0 18px 0;"
                 th:text="'안녕하세요, ' + ${userName} + '님! 운행에 대한 최근 리포트입니다.'">안녕하세요!</div>
          </td>
        </tr>

        <!-- 평균 주행점수 (0~100 → % 막대) -->
        <tr>
          <td style="padding:0 28px 8px 28px; font-family:Segoe UI, Arial, Helvetica, sans-serif; color:#222222;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f8f9fb; border-radius:16px;">
              <tr>
                <td style="padding:24px;">
                  <div style="font-size:18px; font-weight:700; margin:0 0 6px 0;">평균 주행점수</div>
                  <div style="font-size:30px; font-weight:800; color:#176ecc; margin:0 0 12px 0;"
                       th:text="${driveScoreAvg == null ? '0.00' : #numbers.formatDecimal(driveScoreAvg,1,2)}">0.00</div>
                  <div style="width:100%; height:14px; background:#dfe5ec; border-radius:7px; overflow:hidden;">
                    <div th:with="pctScore=${T(java.lang.Math).max(0.0, T(java.lang.Math).min(100.0, (driveScoreAvg == null ? 0.0 : driveScoreAvg)))}"
                         th:style="|height:14px; width:${pctScore}%; background:linear-gradient(90deg,#7ab5e0,#176ecc); border-radius:7px;|"></div>
                  </div>
                  <div style="font-size:12px; color:#8895a7; margin-top:8px;">점수가 높을수록 안전한 운전입니다.</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr><td style="height:16px; line-height:16px; font-size:0;">&nbsp;</td></tr>

        <!-- 조작 항목 3개: 절대 기준치 방식 -->
        <tr>
          <td style="padding:0 28px 24px 28px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>

                <!-- 가속 -->
                <td width="33.33%" style="padding:0 8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f8f9fb; border-radius:16px;">
                    <tr><td style="padding:18px 16px; font-family:Segoe UI, Arial, Helvetica, sans-serif; color:#222222;">
                      <div style="font-size:16px; font-weight:700;">가속 횟수</div>
                      <div style="font-size:22px; font-weight:800; color:#176ecc;"
                           th:text="${accelCountSum == null ? 0 : accelCountSum}">0</div>

                      <div style="width:100%; height:11px; background:#dfe5ec; border-radius:6px; overflow:hidden; margin-top:6px;">
                        <div th:with="
                                   denom=${accelMax == null ? 0.0 : accelMax},
                                   rawPct=${(accelCountSum == null or denom == 0.0) ? 0.0 : ((accelCountSum * 100.0) / denom)},
                                   pct=${T(java.lang.Math).max(0.0, T(java.lang.Math).min(100.0, rawPct))}
                                 "
                             th:style="|height:11px; width:${pct}%; background:linear-gradient(90deg,#7ab5e0,#176ecc); border-radius:6px;|">
                        </div>
                      </div>

                      <div style="font-size:12px; color:#8895a7; margin-top:8px;"
                           th:text="'하루 평균: ' + (${accelCountAvg == null ? '0.00' : #numbers.formatDecimal(accelCountAvg,1,2)})">하루 평균: 0.00</div>
                      <div style="font-size:11px; color:#a3afbf; margin-top:2px;"
                           th:if="${accelMax != null}" th:text="|기준: ${#numbers.formatDecimal(accelMax,1,0)}회|">기준</div>
                    </td></tr>
                  </table>
                </td>

                <!-- 브레이크 -->
                <td width="33.33%" style="padding:0 8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f8f9fb; border-radius:16px;">
                    <tr><td style="padding:18px 16px; font-family:Segoe UI, Arial, Helvetica, sans-serif; color:#222222;">
                      <div style="font-size:16px; font-weight:700;">브레이크 횟수</div>
                      <div style="font-size:22px; font-weight:800; color:#176ecc;"
                           th:text="${brakeCountSum == null ? 0 : brakeCountSum}">0</div>

                      <div style="width:100%; height:11px; background:#dfe5ec; border-radius:6px; overflow:hidden; margin-top:6px;">
                        <div th:with="
                                   denom=${brakeMax == null ? 0.0 : brakeMax},
                                   rawPct=${(brakeCountSum == null or denom == 0.0) ? 0.0 : ((brakeCountSum * 100.0) / denom)},
                                   pct=${T(java.lang.Math).max(0.0, T(java.lang.Math).min(100.0, rawPct))}
                                 "
                             th:style="|height:11px; width:${pct}%; background:linear-gradient(90deg,#7ab5e0,#176ecc); border-radius:6px;|">
                        </div>
                      </div>

                      <div style="font-size:12px; color:#8895a7; margin-top:8px;"
                           th:text="'하루 평균: ' + (${brakeCountAvg == null ? '0.00' : #numbers.formatDecimal(brakeCountAvg,1,2)})">하루 평균: 0.00</div>
                      <div style="font-size:11px; color:#a3afbf; margin-top:2px;"
                           th:if="${brakeMax != null}" th:text="|기준: ${#numbers.formatDecimal(brakeMax,1,0)}회|">기준</div>
                    </td></tr>
                  </table>
                </td>

                <!-- 핸들 미숙조작 -->
                <td width="33.33%" style="padding:0 8px;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f8f9fb; border-radius:16px;">
                    <tr><td style="padding:18px 16px; font-family:Segoe UI, Arial, Helvetica, sans-serif; color:#222222;">
                      <div style="font-size:16px; font-weight:700;">핸들 미숙조작</div>
                      <div style="font-size:22px; font-weight:800; color:#176ecc;"
                           th:text="${handleMissCountSum == null ? 0 : handleMissCountSum}">0</div>

                      <div style="width:100%; height:11px; background:#dfe5ec; border-radius:6px; overflow:hidden; margin-top:6px;">
                        <div th:with="
                                   denom=${handleMax == null ? 0.0 : handleMax},
                                   rawPct=${(handleMissCountSum == null or denom == 0.0) ? 0.0 : ((handleMissCountSum * 100.0) / denom)},
                                   pct=${T(java.lang.Math).max(0.0, T(java.lang.Math).min(100.0, rawPct))}
                                 "
                             th:style="|height:11px; width:${pct}%; background:linear-gradient(90deg,#7ab5e0,#176ecc); border-radius:6px;|">
                        </div>
                      </div>

                      <div style="font-size:12px; color:#8895a7; margin-top:8px;"
                           th:text="'하루 평균: ' + (${handleMissCountAvg == null ? '0.00' : #numbers.formatDecimal(handleMissCountAvg,1,2)})">하루 평균: 0.00</div>
                      <div style="font-size:11px; color:#a3afbf; margin-top:2px;"
                           th:if="${handleMax != null}" th:text="|기준: ${#numbers.formatDecimal(handleMax,1,0)}회|">기준</div>
                    </td></tr>
                  </table>
                </td>

              </tr>
            </table>
          </td>
        </tr>

        <!-- 기간 안내 -->
        <tr>
          <td style="padding:0 28px 28px 28px; font-family:Segoe UI, Arial, Helvetica, sans-serif; color:#222222;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="center">
                  <div style="font-size:14px; color:#99a3b3; line-height:1.7;">
                    안전운전 하셔서 감사합니다.<br/>
                    <span th:text="${period} + ' 리포트 기준기간: ' + ${days} + '일'">기준기간</span><br/>
                    <span th:text="${dateRange}">기간</span>
                  </div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
