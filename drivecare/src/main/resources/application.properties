spring.application.name=drivecare

server.port=12432

# DB 연결 정보
spring.datasource.url=jdbc:sqlserver://10.10.12.213:1433;databaseName=SDV_drivecare;encrypt=true;trustServerCertificate=true
spring.datasource.username=adluser
spring.datasource.password=Gitauto!1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

